<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Probe matches · Sportsbet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%230ca30c'/></svg>">
<style>
:root{color-scheme:light dark;
--surface:#fcfcfb;--plane:#f4f4f1;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
--grid:#e1e0d9;--border:rgba(11,11,11,.11);
--s1:#2a78d6;--s2:#eb6834;--s3:#1a9e73;--good:#0ca30c;--warn:#c98600;--crit:#d03b3b;--up:#0a7d0a;}
@media(prefers-color-scheme:dark){:root{
--surface:#1a1a19;--plane:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
--grid:#2c2c2a;--border:rgba(255,255,255,.11);
--s1:#3987e5;--s2:#d95926;--s3:#22b98a;--good:#12b312;--warn:#fab219;--crit:#e05555;--up:#12b312;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0 auto;background:var(--plane);color:var(--ink);
font:15px/1.5 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
padding:14px 14px calc(34px + env(safe-area-inset-bottom));max-width:1180px}
h1{font-size:17px;margin:0;letter-spacing:-.01em}
a{color:var(--s1);text-decoration:none}
a:hover{text-decoration:underline}
.sub{color:var(--ink2);font-size:12px;margin:3px 0 0}
header{padding-bottom:12px;border-bottom:1px solid var(--grid);margin-bottom:14px}
.back{font-size:12px;font-weight:600;display:inline-block;margin-bottom:7px}
.tabs{display:flex;gap:7px;margin:12px 0 4px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:999px;border:1px solid var(--border);
background:var(--surface);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab.on{background:var(--ink);color:var(--plane);border-color:var(--ink)}
.lede{color:var(--ink2);font-size:12.5px;margin:10px 0 16px;max-width:80ch;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
.m{background:var(--surface);border:1px solid var(--border);border-radius:12px;
padding:12px 13px 10px}
.m.won{border-color:color-mix(in srgb,var(--good) 50%,var(--border))}
.m.lost{border-color:color-mix(in srgb,var(--crit) 30%,var(--border))}
.mh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:650;font-size:14.5px;line-height:1.3}
.tk{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
color:var(--muted);margin-top:2px;word-break:break-all}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
font-size:10.5px;font-weight:650;border:1px solid currentColor;white-space:nowrap}
.chip.plain{border-color:var(--border);color:var(--ink2);font-weight:600}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
svg.ch{width:100%;height:auto;display:block;margin:9px 0 4px;overflow:visible}
.leg{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--ink2);
align-items:center;margin-top:2px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;
vertical-align:-1px}
.note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
details{margin-top:8px}
details>summary{list-style:none;cursor:pointer;font-size:11.5px;font-weight:650;
color:var(--s1);padding:4px 0;display:flex;align-items:center;gap:5px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";font-size:9px;transition:transform .12s}
details[open]>summary::before{transform:rotate(90deg)}
table{width:100%;border-collapse:collapse;background:var(--plane);
border:1px solid var(--border);border-radius:9px;overflow:hidden;font-size:12px;
margin-top:5px}
th{text-align:left;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--grid);font-weight:600}
td{padding:5px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;
vertical-align:top}
tr:last-child td{border-bottom:none}
.empty{color:var(--muted);font-size:13px;padding:15px 14px;background:var(--surface);
border:1px dashed var(--border);border-radius:12px;line-height:1.6}
.dim{color:var(--muted)}
footer{margin-top:28px;padding-top:13px;border-top:1px solid var(--grid);
color:var(--muted);font-size:11.5px;line-height:1.6}
</style>
</head>
<body>

<header>
  <a class="back" href="./">&larr; command center</a>
  <h1 id="title">Probe matches</h1>
  <div class="sub" id="sub">loading&hellip;</div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="lede" id="lede"></div>
<div id="body"></div>
<footer id="foot"></footer>

<script>
const REFRESH = 60000;
let data = null, current = new URLSearchParams(location.search).get("p") || "despair";

const esc = s => String(s === null || s === undefined ? "" : s)
  .replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const hhmm = ts => new Date(ts*1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
const daytime = ts => new Date(ts*1000).toLocaleString([],
  {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
const c1 = v => v === null || v === undefined ? "—" : (Math.round(v*10)/10) + "¢";
function dur(s){
  if(s === null || s === undefined) return "—";
  s = Math.floor(s);
  if(s < 60) return s + "s";
  if(s < 3600) return Math.floor(s/60) + "m";
  return Math.floor(s/3600) + "h" + String(Math.floor(s%3600/60)).padStart(2,"0");
}

const KIND = {
  place:  {col:"var(--s1)",   name:"order rested"},
  fill:   {col:"var(--up)",   name:"FILLED"},
  cancel: {col:"var(--muted)",name:"pulled"},
  entry:  {col:"var(--s2)",   name:"bought"},
  close:  {col:"var(--crit)", name:"closed"}
};

/* A single linear y-scale buries the whole story: the despair probe acts between 2¢
   and 6¢ while the price travels 100¢ to 0¢, so every marker lands in one pixel row.
   So the axis is piecewise — the band the probe actually acted in gets half the
   height, and the rest of 0–100¢ shares the other half. Ticks are labelled, so the
   distortion is visible rather than silent. */
function scaleFor(actions, path){
  const px = actions.map(a => a.px).filter(v => v !== null && v !== undefined);
  let lo = px.length ? Math.max(0, Math.min(...px) - 3) : 0;
  let hi = px.length ? Math.min(100, Math.max(...px) + 3) : 100;
  if(hi - lo < 6){ const m = (hi+lo)/2; lo = Math.max(0, m-4); hi = Math.min(100, m+4); }
  const T = 8, H = 150, B = 18, plot = H - T - B;
  // bottom→top: [0,lo] gets 12%, [lo,hi] gets 52%, [hi,100] gets 36%
  const fBot = 0.12, fBand = 0.52;
  function y(v){
    v = Math.max(0, Math.min(100, v));
    let f;                                    // 0 at the bottom, 1 at the top
    if(v <= lo)      f = lo ? (v/lo)*fBot : 0;
    else if(v <= hi) f = fBot + ((v-lo)/(hi-lo))*fBand;
    else             f = fBot+fBand + ((v-hi)/(100-hi))*(1-fBot-fBand);
    return T + (1-f)*plot;
  }
  // Label the compressed region too. Without a 20¢ and 50¢ tick a price wandering
  // between 10¢ and 30¢ looks like a flat line sitting on the band edge.
  const ticks = [...new Set([0, Math.round(lo), Math.round(hi), 20, 50, 100]
    .filter(v => v >= 0 && v <= 100 && (v <= lo || v >= hi || v === Math.round(lo)
                                        || v === Math.round(hi))))].sort((a,b)=>a-b);
  return {y, ticks, H, T, B, lo, hi};
}

function chart(m){
  const path = m.path || [], acts = m.actions || [];
  const W = 340, L = 22, R = 8;
  const s = scaleFor(acts, path);
  let t0 = Infinity, t1 = -Infinity;
  path.forEach(p => { if(p[0]<t0) t0=p[0]; if(p[0]>t1) t1=p[0]; });
  acts.forEach(a => { if(a.ts<t0) t0=a.ts; if(a.ts>t1) t1=a.ts; });
  if(!isFinite(t0)) return "<div class='note'>No timeline for this market.</div>";
  const span = Math.max(60, t1 - t0);
  const X = t => L + ((t - t0)/span) * (W-L-R);

  let o = "<svg class='ch' viewBox='0 0 "+W+" "+s.H+"' role='img' aria-label='odds timeline'>";
  // the band the probe acted in
  o += "<rect x='"+L+"' y='"+s.y(s.hi).toFixed(1)+"' width='"+(W-L-R)+"' height='"+
       (s.y(s.lo)-s.y(s.hi)).toFixed(1)+"' fill='var(--s2)' opacity='.08'/>";
  // Drop any tick that would print on top of one already drawn — the piecewise scale
  // puts e.g. 9¢ and 20¢ within a few pixels of each other.
  const drawn = [];
  s.ticks.filter(v => {
    const y = s.y(v);
    if(drawn.some(o => Math.abs(o - y) < 9)) return false;
    drawn.push(y); return true;
  }).forEach(v => {
    const y = s.y(v).toFixed(1);
    o += "<line x1='"+L+"' x2='"+(W-R)+"' y1='"+y+"' y2='"+y+
         "' stroke='var(--grid)' stroke-width='.5'/>" +
         "<text x='"+(L-3)+"' y='"+(+y+2.6).toFixed(1)+"' text-anchor='end' font-size='7' "+
         "fill='var(--muted)'>"+v+"</text>";
  });
  // bid/ask band, then the mid
  const band = path.filter(p => p[2] !== null && p[3] !== null);
  if(band.length > 2){
    o += "<polygon fill='var(--s1)' opacity='.13' points='" +
      band.map(p => X(p[0]).toFixed(1)+","+s.y(p[3]).toFixed(1)).join(" ") + " " +
      band.slice().reverse().map(p => X(p[0]).toFixed(1)+","+s.y(p[2]).toFixed(1)).join(" ") +
      "'/>";
  }
  if(path.length > 1){
    o += "<polyline fill='none' stroke='var(--s1)' stroke-width='1.3' stroke-linejoin='round'"+
         " points='" + path.map(p => X(p[0]).toFixed(1)+","+s.y(p[1]).toFixed(1)).join(" ") + "'/>";
  }
  // actions
  acts.forEach(a => {
    const x = X(a.ts), col = (KIND[a.kind]||KIND.place).col;
    // A full-height line for EVERY action buries the price under 30 dashes on a busy
    // ladder. Only the events that changed the position get one; the rest are markers.
    if(a.kind === "fill" || a.kind === "entry" || a.kind === "close"){
      o += "<line x1='"+x.toFixed(1)+"' x2='"+x.toFixed(1)+"' y1='"+s.T+"' y2='"+(s.H-s.B)+
           "' stroke='"+col+"' stroke-width='.7' stroke-dasharray='2 2' opacity='.5'/>";
    }
    if(a.px === null || a.px === undefined) return;
    const y = s.y(a.px);
    if(a.kind === "fill")
      o += "<circle cx='"+x.toFixed(1)+"' cy='"+y.toFixed(1)+"' r='3.4' fill='"+col+
           "' stroke='var(--surface)' stroke-width='.9'/>";
    else if(a.kind === "cancel")
      o += "<path d='M"+(x-2.4).toFixed(1)+" "+(y-2.4).toFixed(1)+" l4.8 4.8 M"+
           (x+2.4).toFixed(1)+" "+(y-2.4).toFixed(1)+" l-4.8 4.8' stroke='"+col+
           "' stroke-width='1.1' fill='none'/>";
    else
      o += "<rect x='"+(x-2.6).toFixed(1)+"' y='"+(y-2.6).toFixed(1)+
           "' width='5.2' height='5.2' fill='none' stroke='"+col+"' stroke-width='1.2'/>";
  });
  // time axis
  [[t0,"start"],[t0+span/2,""],[t1,"end"]].forEach(([t,],i) => {
    o += "<text x='"+X(t).toFixed(1)+"' y='"+(s.H-5)+"' font-size='7' fill='var(--muted)' "+
         "text-anchor='"+(i===0?"start":i===2?"end":"middle")+"'>"+hhmm(t)+"</text>";
  });
  return o + "</svg>";
}

function matchCard(m, probe){
  const res = m.result === "yes" || m.result === "won" ? "won"
            : m.result === "no" || m.result === "lost" ? "lost" : "";
  const chips = [];
  if(probe === "despair"){
    chips.push(["plain", m.n_placed + " orders on " + (m.rungs||[]).map(r=>r+"¢").join("/")]);
    chips.push([m.n_filled ? "good" : "plain",
      m.n_filled ? m.n_filled + " filled · " + m.contracts + " contracts" : "no fills"]);
    if(m.strict) chips.push(["plain","V7-strict"]);
    if(m.low !== null && m.low !== undefined)
      chips.push(["plain","low " + c1(m.low)]);
  } else {
    if(m.entry_px) chips.push(["plain","in at " + Number(m.entry_px).toFixed(4)]);
    // The raw state and outcome strings contradict each other at a glance --
    // CLOSED_UNCONFIRMED carrying outcome closed_nofill reads as "we don't know" next
    // to "we do". The OUTCOME is the one that decides the fill rate, so say what it
    // means in words and keep the raw pair only in the fold-out table.
    const OUT = {
      closed_sold:        ["good", "sold at 0.9500"],
      closed_nofill:      ["crit", "never filled — feed healthy, so a confirmed miss"],
      closed_unconfirmed: ["warn", "never filled — feed was down, so unknown"]
    };
    const o = OUT[m.outcome] || [m.state === "SOLD" ? "good" : "plain",
                                 m.outcome || m.state];
    chips.push(o);
    if(m.rest_s) chips.push(["plain","rested " + dur(m.rest_s)]);
    if(m.exit_queue !== null && m.exit_queue !== undefined)
      chips.push(["plain","queue " + m.exit_queue]);
    if(m.p0) chips.push(["plain","p0 " + Number(m.p0).toFixed(2) +
      (m.max_seen ? " · peak " + Number(m.max_seen).toFixed(2) : "")]);
  }
  const kinds = [...new Set((m.actions||[]).map(a => a.kind))];
  const gap = m.path_ends && m.last_ts && (m.last_ts - m.path_ends > 900);

  return "<div class='m " + res + "'>" +
    "<div class='mh'><div><div class='nm'>" + esc(m.title || m.ticker) + "</div>" +
      "<div class='tk'>" + esc(m.ticker) + "</div></div>" +
      "<div style='text-align:right;flex:none'><span class='chip plain'>" +
        daytime(m.first_ts) + "</span>" +
        (res ? "<br><span class='chip' style='color:var(--" + (res==="won"?"good":"crit") +
          ");margin-top:4px'>" + res + "</span>" : "") + "</div></div>" +
    "<div class='chips'>" + chips.map(([c,t]) =>
      "<span class='chip " + (c==="plain"?"plain":"") + "'" +
      (c!=="plain" ? " style='color:var(--"+c+")'" : "") + ">" + esc(t) + "</span>").join("") +
    "</div>" +
    chart(m) +
    "<div class='leg'>" + kinds.map(k =>
      "<span><i style='background:" + (KIND[k]||KIND.place).col + "'></i>" +
      (KIND[k]||{name:k}).name + "</span>").join("") +
      "<span class='dim'>shaded band = where it acted</span></div>" +
    (gap ? "<div class='note'>The odds line stops at " + hhmm(m.path_ends) +
      ", before the last action — the exchange had no later candles when this was " +
      "published.</div>" : "") +
    "<details><summary>" + (m.actions||[]).length + " actions</summary>" +
      "<table><tr><th>Time</th><th>What</th><th>Detail</th></tr>" +
      (m.actions||[]).map(a => "<tr><td class='dim'>" + hhmm(a.ts) + "</td>" +
        "<td style='color:" + (KIND[a.kind]||KIND.place).col + ";font-weight:600'>" +
        esc(a.label) + "</td><td class='dim'>" + esc(a.detail || "") + "</td></tr>").join("") +
      "</table></details>" +
    "</div>";
}

function render(){
  if(!data) return;
  const p = (data.probes || {})[current];
  document.getElementById("tabs").innerHTML = Object.values(data.probes || {}).map(x =>
    "<span class='tab" + (x.id === current ? " on" : "") + "' data-p='" + x.id + "'>" +
    esc(x.name) + " · " + (x.matches||[]).length + "</span>").join("");
  document.querySelectorAll(".tab").forEach(el => el.onclick = () => {
    current = el.dataset.p;
    history.replaceState(null, "", "?p=" + current);
    render();
  });
  if(!p){ document.getElementById("body").innerHTML =
    "<div class='empty'>No such probe.</div>"; return; }

  document.getElementById("title").textContent = p.name + " — matches";
  const ms = p.matches || [];
  document.getElementById("sub").textContent =
    ms.length + " market" + (ms.length===1?"":"s") + " with activity" +
    (ms.length ? " · " + daytime(ms[ms.length-1].first_ts) + " → " + daytime(ms[0].last_ts) : "");
  document.getElementById("lede").innerHTML = esc(p.measures) +
    "<br>Each chart is that market's own odds over time — the shaded blue band is the " +
    "bid–ask spread, the line is the midpoint. Markers are what the probe did, on the " +
    "same clock. <b>The price axis is deliberately not linear:</b> the band the probe " +
    "acted in is stretched to half the height, because otherwise every marker would sit " +
    "in a single pixel row at the bottom of a 0–100¢ chart.";

  let o = ms.length ? "<div class='grid'>" + ms.map(m => matchCard(m, current)).join("") + "</div>"
    : "<div class='empty'><b>No market has been acted on yet.</b> The instrument is " +
      "running and watching; nothing has met its entry conditions.</div>";

  const w = p.watching || [];
  if(w.length){
    o += "<h2 style='font-size:11px;letter-spacing:.08em;text-transform:uppercase;" +
      "color:var(--muted);margin:26px 0 8px'>Watching — favourites at 0.60 or better</h2>" +
      "<table><tr><th>Market</th><th>First seen at</th><th>Peak</th><th>Live</th></tr>" +
      w.map(x => "<tr><td class='tk' style='font-size:11px'>" + esc(x.ticker) + "</td>" +
        "<td>" + Number(x.p0).toFixed(2) + "</td>" +
        "<td" + (x.max_seen >= 0.9 ? " style='color:var(--good);font-weight:650'" : "") + ">" +
        Number(x.max_seen).toFixed(2) + "</td>" +
        "<td class='dim'>" + (x.tainted ? "tainted" : x.inplay ? "in play" : "—") +
        "</td></tr>").join("") + "</table>" +
      "<div class='note'>An entry needs a favourite that was ≥0.60 pre-match, spiked to " +
      "≥0.90 in play, and has come back down to 0.55–0.70. Peak is the highest price seen " +
      "since it was first observed.</div>";
  }
  document.getElementById("body").innerHTML = o;
  document.getElementById("foot").innerHTML =
    "Odds come from Kalshi's own 1-minute candles, cached once a market has settled; " +
    "where the exchange has none, the recorder's book history is used instead. " +
    "Probe actions come from the instrument's own database. Read-only mirror — " +
    "published " + daytime(data.generated) + ".";
}

async function tick(){
  try{
    const r = await fetch("matches.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    data = await r.json();
    render();
  }catch(e){
    if(!data) document.getElementById("body").innerHTML =
      "<div class='empty'>Can't load matches.json — " + esc(e.message) + "</div>";
  }
}
tick();
setInterval(tick, REFRESH);
document.addEventListener("visibilitychange", () => { if(!document.hidden) tick(); });
</script>
</body>
</html>
